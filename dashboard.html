<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #05070d; --panel: rgba(16, 24, 40, .62); --panel-solid: #0d1320; --text: #e6f1ff; --muted: #7d8ba6;
    --border: rgba(110, 180, 255, .16); --border-hi: rgba(56, 232, 255, .55); --accent: #38e8ff; --accent-2: #a855f7;
    --interview: #2effb0; --under_review: #3d8bff; --declined: #ff3d8b; --not_relevant: #6b7a90;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--text); background:
           radial-gradient(900px 500px at 8% -10%, rgba(56, 232, 255, .14), transparent 60%),
           radial-gradient(800px 500px at 100% 0%, rgba(168, 85, 247, .14), transparent 60%),
           linear-gradient(rgba(110, 180, 255, .045) 1px, transparent 1px) 0 0 / 40px 40px,
           linear-gradient(90deg, rgba(110, 180, 255, .045) 1px, transparent 1px) 0 0 / 40px 40px,
           var(--bg);
         background-attachment: fixed;
         font: 14px/1.5 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  ::selection { background: rgba(56, 232, 255, .3); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-shadow: 0 0 8px var(--accent); }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 22px 24px 10px; }
  .brand { margin-right: auto; display: flex; flex-direction: column; }
  .eyebrow { font: 600 10px/1 var(--mono); letter-spacing: .28em; color: var(--accent); text-transform: uppercase; }
  h1 { font-size: 24px; font-weight: 700; margin: 4px 0 0; letter-spacing: -.01em;
       background: linear-gradient(90deg, #fff 0%, var(--accent) 55%, var(--accent-2) 100%);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .status { font: 12px var(--mono); color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--interview);
                    box-shadow: 0 0 10px var(--interview); animation: pulse 2s infinite; }
  .status.err { color: var(--declined); }
  .status.err::before { background: var(--declined); box-shadow: 0 0 10px var(--declined); }
  @keyframes pulse { 50% { opacity: .35; } }
  select, input[type=search], button {
    font: 13px "Space Grotesk", sans-serif; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color .2s, box-shadow .2s; }
  input[type=search] { width: 180px; }
  select:focus, input:focus, button:focus-visible { outline: none; border-color: var(--border-hi); box-shadow: 0 0 0 3px rgba(56, 232, 255, .15); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--border-hi); box-shadow: 0 0 14px rgba(56, 232, 255, .25); }
  button:disabled { opacity: .45; cursor: default; }
  #run { border-color: var(--border-hi); color: var(--accent); }
  .toggle { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 12px;
            background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .toggle button { border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; color: var(--muted); box-shadow: none; }
  .toggle button:hover:not(.on) { color: var(--text); box-shadow: none; }
  .toggle button.on { color: #04121a; font-weight: 600; background: linear-gradient(90deg, var(--accent), #7dd3fc);
                      box-shadow: 0 0 16px rgba(56, 232, 255, .45); }
  @media (max-width: 560px) { header { padding: 16px 16px 8px; } input[type=search] { width: 100%; } }

  /* ---------- shared surfaces ---------- */
  .card, .tile, .panel, .month {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 10px 30px rgba(0, 0, 0, .35); }
  .card { position: relative; overflow: hidden; padding: 12px 14px 12px 16px; margin-bottom: 10px; transition: transform .15s, border-color .2s, box-shadow .2s; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
                  background: var(--c, var(--accent)); box-shadow: 0 0 12px var(--c, var(--accent)); }
  .card:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--c, var(--accent)) 55%, transparent);
                box-shadow: 0 0 22px color-mix(in srgb, var(--c, var(--accent)) 22%, transparent), 0 10px 30px rgba(0, 0, 0, .35); }
  .company { font-weight: 600; }
  .role { color: var(--muted); font-size: 13px; }
  .summary { margin: 6px 0 0; color: #c7d4ea; }
  .next { margin-top: 6px; font-size: 13px; }
  .meta { margin-top: 8px; font: 11px var(--mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  details { margin-top: 6px; font-size: 12px; color: var(--muted); }
  details li { margin: 3px 0; }
  summary { cursor: pointer; }
  .empty { color: var(--muted); font: 12px var(--mono); padding: 8px 2px; }
  .pill { font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px;
          white-space: nowrap; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
          background: color-mix(in srgb, var(--c) 12%, transparent); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 25%, transparent); }

  /* ---------- last 24h strip ---------- */
  .strip { padding: 6px 24px 4px; }
  @media (max-width: 560px) { .strip { padding: 6px 16px 4px; } }
  .strip-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .strip-head h2 { margin: 0; font: 600 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .strip-head span { font: 11px var(--mono); color: var(--muted); }
  .strip-row { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .strip-row .card { flex: 0 0 280px; margin: 0; scroll-snap-align: start; cursor: pointer; }
  .strip-row .card .top { display: flex; align-items: center; gap: 8px; }
  .strip-row .card .company { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip-row .summary { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .strip-row .new { font: 600 9px var(--mono); letter-spacing: .12em; color: #04121a; background: var(--accent);
                    padding: 2px 5px; border-radius: 4px; box-shadow: 0 0 10px var(--accent); }

  /* ---------- status board ---------- */
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 12px 24px 32px; }
  @media (max-width: 900px) { .board { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .board { grid-template-columns: 1fr; padding: 12px 16px 24px; } }
  .col h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
            font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .count { margin-left: auto; color: var(--text); font-variant-numeric: tabular-nums; }

  /* ---------- companies ---------- */
  .companies { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 12px 24px 32px; }
  @media (max-width: 560px) { .companies { padding: 12px 16px 24px; } }
  .companies .card { margin: 0; }
  .app { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
  .app .r { flex: 1; min-width: 0; }

  /* ---------- calendar ---------- */
  .cal { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 20px; padding: 12px 24px 32px; align-items: start; }
  @media (max-width: 900px) { .cal { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .cal { padding: 12px 16px 24px; } }
  .month { overflow: hidden; }
  .month-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .month-head strong { margin-right: auto; font-size: 16px; }
  .month-head button { padding: 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow { font: 600 10px var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; padding: 8px; }
  .day { min-height: 88px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); padding: 4px 6px; font-size: 12px; }
  .day:nth-child(7n+1) { border-left: 0; }
  .day.other { opacity: .35; }
  .day .n { display: inline-block; min-width: 22px; text-align: center; border-radius: 6px; margin-bottom: 2px; font: 11px var(--mono); }
  .day.today { background: rgba(56, 232, 255, .05); }
  .day.today .n { background: var(--accent); color: #04121a; font-weight: 600; box-shadow: 0 0 12px var(--accent); }
  .chip { display: block; font: 10px var(--mono); padding: 2px 5px; margin-top: 3px; border-radius: 5px; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; color: var(--interview); border: 1px solid color-mix(in srgb, var(--interview) 40%, transparent);
          background: color-mix(in srgb, var(--interview) 12%, transparent); }
  .chip.past { color: var(--muted); border-color: var(--border); background: transparent; }
  @media (max-width: 560px) { .day { min-height: 52px; padding: 2px; } .chip { font-size: 9px; padding: 0 3px; } }
  .agenda h3 { font: 600 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
  .agenda .day-label { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 14px 0 6px; }
  .agenda .card { --c: var(--interview); }
  .when { font: 600 13px var(--mono); color: var(--interview); text-shadow: 0 0 10px color-mix(in srgb, var(--interview) 50%, transparent); }

  /* ---------- stats ---------- */
  .stats { padding: 12px 24px 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (max-width: 560px) { .stats { padding: 12px 16px 24px; } }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .tile, .panel { padding: 16px 18px; }
  .tile .label { font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tile .value { font-size: 34px; font-weight: 700; margin-top: 6px; line-height: 1.1; }
  .tile .sub { font: 11px var(--mono); color: var(--muted); }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; box-shadow: 0 0 8px currentColor; }
  .panel h3 { font-size: 15px; margin: 0 0 2px; }
  .panel .desc { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { color: var(--text); font-weight: 600; }
  .split { display: flex; gap: 3px; height: 30px; }
  .split div { border-radius: 6px; min-width: 4px; display: flex; align-items: center; justify-content: center;
               font: 600 12px var(--mono); color: #04121a; outline-offset: 2px; box-shadow: 0 0 14px color-mix(in srgb, currentColor 0%, transparent); }
  .split div:hover, .chart .seg:hover { filter: brightness(1.2) drop-shadow(0 0 6px rgba(255,255,255,.25)); }
  .chart { width: 100%; display: block; overflow: visible; }
  .chart text { fill: var(--muted); font: 10px var(--mono); }
  .chart .grid-line { stroke: var(--border); stroke-width: 1; }
  .chart .seg { outline: none; }
  .chart .seg:focus-visible { stroke: var(--text); stroke-width: 2; }
  .tip { position: fixed; pointer-events: none; z-index: 10; background: var(--panel-solid); border: 1px solid var(--border-hi);
         border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 0 20px rgba(56, 232, 255, .2); }
  .tip .tv { font: 600 16px var(--mono); }
  .tip .tk { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .panel details { margin-top: 10px; }
  .panel table { border-collapse: collapse; margin-top: 8px; font: 12px var(--mono); }
  .panel th, .panel td { padding: 4px 12px 4px 0; text-align: right; border-bottom: 1px solid var(--border); }
  .panel th:first-child, .panel td:first-child { text-align: left; }

  /* ---------- last 24h view ---------- */
  .recent { padding: 12px 24px 32px; max-width: 780px; }
  @media (max-width: 560px) { .recent { padding: 12px 16px 24px; } }
  .recent .lead { color: var(--muted); margin: 0 0 14px; }
  .recent .row { display: flex; align-items: center; gap: 8px; }
  .recent .row .company { margin-right: auto; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="eyebrow">Job search · live</span><h1>Job Applications</h1></div>
  <span id="status" class="status">Loading…</span>
  <div class="toggle"><button id="v-status" class="on">By status</button><button id="v-company">By company</button><button id="v-calendar">Calendar</button><button id="v-stats">Stats</button><button id="v-recent">Last 24h</button></div>
  <select id="sort" aria-label="Sort by">
    <option value="newest">Sort: Newest first</option>
    <option value="oldest">Sort: Oldest first</option>
    <option value="status">Sort: Status</option>
    <option value="company">Sort: Company A–Z</option>
    <option value="emails">Sort: Most emails</option>
  </select>
  <input id="q" type="search" placeholder="Filter company or role">
  <button id="run">Check now</button>
</header>
<section id="strip" class="strip"></section>
<main id="board"></main>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script>
const COLUMNS = [
  ["interview", "Interviews"],
  ["under_review", "Under review"],
  ["declined", "Declined"],
  ["not_relevant", "Not relevant anymore"],
];
const LABELS = Object.fromEntries(COLUMNS);
let data = { state: {}, emails: [] };
let view = "status";
let calMonth = new Date(); calMonth.setDate(1);
let sortBy = "newest";
try { view = localStorage.getItem("view") || "status"; sortBy = localStorage.getItem("sort") || "newest"; } catch {}

// Works on anything with { name, date, count, rank } so both views sort the same way.
// rank follows the column order: interview first, not relevant last.
const SORTS = {
  newest: (a, b) => b.date.localeCompare(a.date),
  oldest: (a, b) => a.date.localeCompare(b.date),
  company: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }),
  emails: (a, b) => b.count - a.count || b.date.localeCompare(a.date),
  status: (a, b) => a.rank - b.rank || b.date.localeCompare(a.date),
};
const rank = cat => COLUMNS.findIndex(([c]) => c === cat);
view = new URLSearchParams(location.search).get("view") || view;  // e.g. jobs.local/?view=stats
if (!SORTS[sortBy]) sortBy = "newest";
if (!["status", "company", "calendar", "stats", "recent"].includes(view)) view = "status";
const sortKey = a => ({ name: a.latest.company || a.latest.sender, date: a.latest.received_at, count: a.history.length, rank: rank(a.latest.category) });

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const ago = t => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };

// One card per application: emails are grouped by company+role and the newest one sets the status.
// Emails that don't name the role (e.g. "thanks for applying") join that company's
// most recently active application, so one application never shows in two columns.
const norm = s => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function applications(emails) {
  const groups = new Map();
  const add = (key, e) => { if (!groups.has(key)) groups.set(key, []); groups.get(key).push(e); };
  for (const e of emails.filter(e => e.role)) add(norm(e.company || e.sender) + "|" + norm(e.role), e);
  for (const e of emails.filter(e => !e.role)) {
    const company = norm(e.company || e.sender);
    const match = [...groups.keys()].filter(k => k.startsWith(company + "|"))
      .sort((a, b) => groups.get(b)[0].received_at.localeCompare(groups.get(a)[0].received_at))[0];
    add(match || company + "|", e);
  }
  for (const list of groups.values()) list.sort((a, b) => b.received_at.localeCompare(a.received_at));

  // A company's later decision (interview, declined, not relevant) supersedes its earlier
  // "under review" emails, even for a different role, so it stops showing as under review.
  for (const [key, list] of [...groups.entries()]) {
    if (list[0].category !== "under_review") continue;
    const company = key.split("|")[0];
    const later = [...groups.entries()].find(([k, l]) => k !== key && k.split("|")[0] === company &&
      l[0].category !== "under_review" && l[0].received_at > list[0].received_at);
    if (later) { later[1].push(...list); groups.delete(key); }
  }

  return [...groups.values()].map(list => {
    list.sort((a, b) => b.received_at.localeCompare(a.received_at));
    return { latest: list[0], history: list, role: (list.find(x => x.role) || {}).role || "" };
  }).sort((a, b) => b.latest.received_at.localeCompare(a.latest.received_at));
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const apps = applications(data.emails).filter(a =>
    !q || `${a.latest.company} ${a.role} ${a.latest.sender}`.toLowerCase().includes(q))
    .sort((a, b) => SORTS[sortBy](sortKey(a), sortKey(b)));
  document.getElementById("sort").value = sortBy;
  const board = document.getElementById("board");
  for (const v of ["status", "company", "calendar", "stats", "recent"])
    document.getElementById("v-" + v).classList.toggle("on", view === v);
  document.getElementById("sort").hidden = ["calendar", "stats", "recent"].includes(view);
  board.className = { status: "board", company: "companies", calendar: "cal", stats: "stats", recent: "recent" }[view];
  board.innerHTML = { status: statusView, company: companyView, calendar: calendarView, stats: statsView,
                      recent: recentView }[view](apps);
  renderStrip(apps);
  renderStatus();
}

// Always-on "last 24 hours" row at the top (hidden on the Last 24h tab, which shows the same list in full).
function renderStrip(apps) {
  const strip = document.getElementById("strip");
  strip.hidden = view === "recent";
  if (strip.hidden) return;
  const keep = new Set(apps.flatMap(a => a.history.map(e => e.id)));
  const since = Date.now() - 24 * 60 * 60 * 1000;
  const rows = data.emails.filter(e => keep.has(e.id) && new Date(e.received_at) >= since);
  const ago = iso => { const h = Math.floor((Date.now() - new Date(iso)) / 3.6e6);
    return h < 1 ? `${Math.max(1, Math.floor((Date.now() - new Date(iso)) / 6e4))}m ago` : `${h}h ago`; };
  strip.innerHTML = `<div class="strip-head"><h2>Last 24 hours</h2>
      <span>${rows.length ? `${rows.length} email${rows.length > 1 ? "s" : ""}` : "nothing new"}</span></div>
    ${rows.length ? `<div class="strip-row">${rows.map(e => `
      <a class="card" style="--c: var(--${e.category}); color: inherit" href="https://mail.google.com/mail/u/0/#all/${esc(e.thread_id)}" target="_blank">
        <div class="top">${Date.now() - new Date(e.received_at) < 3 * 3.6e6 ? `<span class="new">NEW</span>` : ""}
          <span class="company">${esc(e.company || e.sender)}</span><span class="pill">${esc(LABELS[e.category])}</span></div>
        ${e.role ? `<div class="role">${esc(e.role)}</div>` : ""}
        <p class="summary">${esc(e.summary)}</p>
        <div class="meta"><span>${ago(e.received_at)}</span></div>
      </a>`).join("")}</div>` : ""}`;
}

// ---------- last 24 hours ----------
// Every job email from the last day (not one card per application), newest first.
function recentView(apps) {
  const keep = new Set(apps.flatMap(a => a.history.map(e => e.id)));  // respects the search filter
  const since = Date.now() - 24 * 60 * 60 * 1000;
  const rows = data.emails.filter(e => keep.has(e.id) && new Date(e.received_at) >= since);
  const counts = COLUMNS.map(([c, t]) => [t, rows.filter(e => e.category === c).length]).filter(([, n]) => n);
  const lead = rows.length
    ? `${rows.length} job email${rows.length > 1 ? "s" : ""} in the last 24 hours: ${counts.map(([t, n]) => `${n} ${t.toLowerCase()}`).join(", ")}`
    : "No job emails in the last 24 hours.";
  return `<p class="lead">${esc(lead)}</p>` + rows.map(e => `
    <div class="card" style="--c: var(--${e.category})">
      <div class="row"><span class="company">${esc(e.company || e.sender)}</span>
        <span class="pill">${esc(LABELS[e.category])}</span></div>
      ${e.role ? `<div class="role">${esc(e.role)}</div>` : ""}
      <p class="summary">${esc(e.summary)}</p>
      ${e.next_step ? `<div class="next">→ ${esc(e.next_step)}</div>` : ""}
      <div class="meta">
        <span>${new Date(e.received_at).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" })}</span>
        <a href="https://mail.google.com/mail/u/0/#all/${esc(e.thread_id)}" target="_blank">Open in Gmail</a>
      </div>
    </div>`).join("");
}

// ---------- stats ----------
const pct = (n, total) => total ? Math.round(100 * n / total) : 0;
const tipAttrs = (value, label, cat) =>
  `tabindex="0" data-tv="${esc(value)}" data-tl="${esc(label)}" data-tc="${cat}"`;

function statsView(apps) {
  const total = apps.length;
  const counts = Object.fromEntries(COLUMNS.map(([c]) => [c, apps.filter(a => a.latest.category === c).length]));

  const tiles = `<div class="kpis">
    <div class="tile"><div class="label">Applications</div><div class="value">${total}</div>
      <div class="sub">${data.emails.length} emails</div></div>
    ${COLUMNS.map(([c, title]) => `<div class="tile">
      <div class="label"><span class="swatch" style="background: var(--${c}); color: var(--${c})"></span>${title}</div>
      <div class="value">${counts[c]}</div><div class="sub">${pct(counts[c], total)}% of applications</div>
    </div>`).join("")}
  </div>`;

  // Part-to-whole: one bar split by status. Labels only inside segments wide enough to hold them.
  const split = `<div class="panel">
    <h3>Where your applications stand</h3>
    <p class="desc">Current status of every application</p>
    <div class="legend">${COLUMNS.map(([c, t]) => `<span><span class="swatch" style="background: var(--${c}); color: var(--${c})"></span>${t} <b>${counts[c]}</b></span>`).join("")}</div>
    <div class="split">${COLUMNS.filter(([c]) => counts[c]).map(([c, t]) =>
      `<div style="flex: ${counts[c]}; background: var(--${c})" ${tipAttrs(counts[c] + " (" + pct(counts[c], total) + "%)", t, c)}>${pct(counts[c], total) >= 8 ? counts[c] : ""}</div>`).join("")}
    </div>
  </div>`;

  return tiles + split + weeklyChart(apps);
}

// Stacked columns: applications by the week they started (first email), split by where they stand now.
function weeklyChart(apps) {
  const weekStart = iso => { const d = new Date(iso); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return d; };
  const weeks = new Map();
  for (const a of apps) {
    const k = dayKey(weekStart(a.history.at(-1).received_at));
    if (!weeks.has(k)) weeks.set(k, Object.fromEntries(COLUMNS.map(([c]) => [c, 0])));
    weeks.get(k)[a.latest.category]++;
  }
  if (!weeks.size) return "";
  // Fill empty weeks so the time axis is continuous.
  const keys = [...weeks.keys()].sort();
  const all = [];
  for (const d = new Date(keys[0] + "T00:00"); dayKey(d) <= keys.at(-1); d.setDate(d.getDate() + 7))
    all.push([dayKey(d), weeks.get(dayKey(d)) || Object.fromEntries(COLUMNS.map(([c]) => [c, 0]))]);

  const W = Math.max(320, (document.getElementById("board").clientWidth || 800) - 84), H = 220;
  const m = { top: 12, right: 8, bottom: 26, left: 28 };
  const max = Math.max(...all.map(([, w]) => Object.values(w).reduce((x, y) => x + y, 0)));
  const step = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const y = v => m.top + (H - m.top - m.bottom) * (1 - v / top);
  const band = (W - m.left - m.right) / all.length, bw = Math.min(24, band * 0.6);
  const label = k => new Date(k + "T00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const every = Math.ceil(all.length / Math.max(1, Math.floor((W - m.left) / 56)));  // avoid crowded x labels

  let svg = "";
  for (let v = 0; v <= top; v += step)
    svg += `<line class="grid-line" x1="${m.left}" x2="${W - m.right}" y1="${y(v)}" y2="${y(v)}"/>
            <text x="${m.left - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  all.forEach(([k, w], i) => {
    const x = m.left + band * i + (band - bw) / 2;
    const segs = COLUMNS.filter(([c]) => w[c]);
    let acc = 0;
    segs.forEach(([c, t], j) => {
      const y0 = y(acc), y1 = y(acc + w[c]);
      const h = Math.max(1, y0 - y1 - (j ? 2 : 0));   // 2px surface gap between stacked segments
      const isTop = j === segs.length - 1, r = Math.min(4, h / 2);
      // Rounded data-end on the top segment only; square at the baseline.
      const path = isTop
        ? `M${x},${y1 + h} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y1 + h} Z`
        : `M${x},${y1} H${x + bw} V${y1 + h} H${x} Z`;
      svg += `<path class="seg" d="${path}" fill="var(--${c})" ${tipAttrs(w[c], `${t} · week of ${label(k)}`, c)}/>`;
      acc += w[c];
    });
    if (i % every === 0)
      svg += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${label(k)}</text>`;
  });

  const table = `<details><summary>Show as table</summary><table>
    <tr><th>Week of</th>${COLUMNS.map(([, t]) => `<th>${t}</th>`).join("")}<th>Total</th></tr>
    ${all.map(([k, w]) => `<tr><td>${label(k)}</td>${COLUMNS.map(([c]) => `<td>${w[c]}</td>`).join("")}
      <td>${Object.values(w).reduce((x, y) => x + y, 0)}</td></tr>`).join("")}
  </table></details>`;

  return `<div class="panel">
    <h3>Applications per week</h3>
    <p class="desc">By the week you applied, colored by where each application stands now</p>
    <div class="legend">${COLUMNS.map(([c, t]) => `<span><span class="swatch" style="background: var(--${c}); color: var(--${c})"></span>${t}</span>`).join("")}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications per week by status">${svg}</svg>
    ${table}
  </div>`;
}

// One shared tooltip for every chart mark (hover and keyboard focus). Text goes in via textContent.
const tip = document.getElementById("tip");
function showTip(e) {
  const t = e.target.closest("[data-tv]");
  if (!t) return hideTip();
  tip.replaceChildren();
  const v = document.createElement("div"); v.className = "tv"; v.textContent = t.dataset.tv;
  const l = document.createElement("div");
  const k = document.createElement("span"); k.className = "tk"; k.style.background = `var(--${t.dataset.tc})`;
  l.append(k, document.createTextNode(t.dataset.tl));
  tip.append(v, l); tip.hidden = false;
  const r = e.clientX !== undefined && e.type === "pointermove" ? { x: e.clientX, y: e.clientY } : (() => {
    const b = t.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top };
  })();
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - tw - 8, Math.max(8, r.x + 12)) + "px";
  tip.style.top = Math.max(8, r.y - tip.offsetHeight - 10) + "px";
}
function hideTip() { tip.hidden = true; }
const boardEl = document.getElementById("board");
boardEl.addEventListener("pointermove", showTip);
boardEl.addEventListener("pointerleave", hideTip);
boardEl.addEventListener("focusin", showTip);
boardEl.addEventListener("focusout", hideTip);
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => view === "stats" && render(), 150); });

// ---------- calendar ----------
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtTime = d => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });

// Scheduled interviews from the emails, one per company + time (an invite and its reminder count once).
function interviews(apps) {
  const keep = new Set(apps.flatMap(a => a.history.map(e => e.id)));  // respects the search filter
  const byKey = new Map();
  for (const e of data.emails) {
    if (!e.interview_at || !keep.has(e.id)) continue;
    const key = norm(e.company) + "|" + e.interview_at;
    if (!byKey.has(key)) byKey.set(key, { ...e, at: new Date(e.interview_at) });  // newest email wins
  }
  return [...byKey.values()].filter(i => !isNaN(i.at)).sort((a, b) => a.at - b.at);
}

function gcalLink(i) {
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const end = new Date(i.at.getTime() + 60 * 60 * 1000);
  const q = new URLSearchParams({ action: "TEMPLATE", text: `Interview: ${i.company}${i.role ? " — " + i.role : ""}`,
    dates: `${f(i.at)}/${f(end)}`, details: i.interview_details || i.summary,
    ctz: Intl.DateTimeFormat().resolvedOptions().timeZone });
  return `https://calendar.google.com/calendar/render?${q}`;
}

function calendarView(apps) {
  const all = interviews(apps), now = new Date();
  const byDay = new Map();
  for (const i of all) { const k = dayKey(i.at); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(i); }

  // Month grid, weeks starting Sunday.
  const start = new Date(calMonth); start.setDate(1 - start.getDay());
  const cells = [];
  for (let d = new Date(start); cells.length < 42; d.setDate(d.getDate() + 1)) {
    if (cells.length === 35 && d.getMonth() !== calMonth.getMonth()) break;
    const k = dayKey(d);
    cells.push(`<div class="day${d.getMonth() !== calMonth.getMonth() ? " other" : ""}${k === dayKey(now) ? " today" : ""}">
      <span class="n">${d.getDate()}</span>
      ${(byDay.get(k) || []).map(i => `<span class="chip${i.at < now ? " past" : ""}" title="${esc(i.interview_details || i.summary)}">${fmtTime(i.at)} ${esc(i.company)}</span>`).join("")}
    </div>`);
  }
  const month = `<div class="month">
    <div class="month-head">
      <strong>${calMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</strong>
      <button data-cal="-1" aria-label="Previous month">‹</button>
      <button data-cal="0">Today</button>
      <button data-cal="1" aria-label="Next month">›</button>
    </div>
    <div class="grid">
      ${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="dow">${d}</div>`).join("")}
      ${cells.join("")}
    </div>
  </div>`;

  // Upcoming list, grouped by day.
  const upcoming = all.filter(i => i.at >= new Date(now.getTime() - 60 * 60 * 1000));
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  const dayLabel = d => dayKey(d) === dayKey(now) ? "Today" : dayKey(d) === dayKey(tomorrow) ? "Tomorrow"
    : d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  let lastDay = "";
  const list = upcoming.map(i => {
    const label = dayLabel(i.at), header = label !== lastDay ? `<div class="day-label">${label}</div>` : "";
    lastDay = label;
    return `${header}<div class="card">
      <div><span class="when">${fmtTime(i.at)}</span> · <span class="company">${esc(i.company)}</span></div>
      ${i.role ? `<div class="role">${esc(i.role)}</div>` : ""}
      ${i.interview_details ? `<p class="summary">${esc(i.interview_details)}</p>` : ""}
      <div class="meta">
        <a href="${esc(gcalLink(i))}" target="_blank">Add to Google Calendar</a>
        <a href="https://mail.google.com/mail/u/0/#all/${esc(i.thread_id)}" target="_blank">Open email</a>
      </div>
    </div>`;
  }).join("");

  // Interview invites that don't have a time yet.
  const scheduled = new Set(all.map(i => norm(i.company)));
  const unscheduled = apps.filter(a => a.latest.category === "interview" && !scheduled.has(norm(a.latest.company)));
  const todo = unscheduled.length ? `<h3 style="margin-top: 24px">Not scheduled yet</h3>` + unscheduled.map(a => `
    <div class="card"><span class="company">${esc(a.latest.company || a.latest.sender)}</span>
      ${a.latest.next_step ? `<div class="next">→ ${esc(a.latest.next_step)}</div>` : ""}
      <div class="meta"><a href="https://mail.google.com/mail/u/0/#all/${esc(a.latest.thread_id)}" target="_blank">Open email</a></div>
    </div>`).join("") : "";

  return month + `<section class="agenda"><h3>Upcoming interviews</h3>
    ${list || `<div class="empty">No interviews scheduled</div>`}${todo}</section>`;
}

// One card per company, listing each application and where it stands.
function companyView(apps) {
  const byCompany = new Map();
  for (const a of apps) {
    const name = a.latest.company || a.latest.sender;
    if (!byCompany.has(name)) byCompany.set(name, []);
    byCompany.get(name).push(a);
  }
  const companyKey = ([name, list]) => ({
    name,
    date: list.map(a => a.latest.received_at).sort().at(-1),
    count: list.reduce((n, a) => n + a.history.length, 0),
    rank: Math.min(...list.map(a => rank(a.latest.category))),  // a company's best status
  });
  const companies = [...byCompany.entries()].sort((x, y) => SORTS[sortBy](companyKey(x), companyKey(y)));
  if (!companies.length) return `<div class="empty">Nothing here</div>`;
  return companies.map(([name, list]) => {
    const emails = list.reduce((n, a) => n + a.history.length, 0);
    return `<div class="card">
      <div class="company">${esc(name)}</div>
      ${list.map(({ latest: e, role }) => `<div class="app" style="--c: var(--${e.category})">
        <span class="r">${esc(role || "Application")}</span>
        <span class="pill">${esc(LABELS[e.category])}</span>
      </div>`).join("")}
      <div class="meta">
        <span>${emails} email${emails > 1 ? "s" : ""} · last ${fmtDate(companyKey([name, list]).date)}</span>
        <a href="https://mail.google.com/mail/u/0/#label/${encodeURIComponent("Jobs/Companies/" + name.replace(/\//g, "-"))}" target="_blank">Open in Gmail</a>
      </div>
    </div>`;
  }).join("");
}

function statusView(apps) {
  return COLUMNS.map(([cat, title]) => {
    const items = apps.filter(a => a.latest.category === cat);
    const cards = items.map(({ latest: e, history, role }) => `
      <div class="card" style="--c: var(--${cat})">
        <div class="company">${esc(e.company || e.sender)}</div>
        ${role ? `<div class="role">${esc(role)}</div>` : ""}
        <p class="summary">${esc(e.summary)}</p>
        ${e.next_step ? `<div class="next">→ ${esc(e.next_step)}</div>` : ""}
        <div class="meta">
          <span>${fmtDate(e.received_at)}</span>
          <a href="https://mail.google.com/mail/u/0/#all/${esc(e.thread_id)}" target="_blank">Open in Gmail</a>
        </div>
        ${history.length > 1 ? `<details><summary>${history.length} emails</summary><ul>${
          history.map(h => `<li>${fmtDate(h.received_at)} · ${esc(h.category.replace("_", " "))} · ${esc(h.subject)}</li>`).join("")
        }</ul></details>` : ""}
      </div>`).join("");
    return `<section class="col">
      <h2><span class="dot" style="background: var(--${cat}); color: var(--${cat})"></span>${title}<span class="count">${items.length}</span></h2>
      ${cards || `<div class="empty">Nothing here</div>`}
    </section>`;
  }).join("");
}

function renderStatus() {
  const s = data.state, el = document.getElementById("status");
  el.className = "status" + (s.error ? " err" : "");
  el.textContent = s.error ? `Last check failed: ${s.error}`
    : s.running ? "Checking Gmail…"
    : s.last_run ? `Checked ${ago(s.last_run)} · every ${s.interval} min` : "Starting…";
  document.getElementById("run").disabled = !!s.running;
}

async function refresh() {
  try { data = await (await fetch("/api/data")).json(); render(); }
  catch { document.getElementById("status").textContent = "Agent not running"; }
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", e => {
  sortBy = e.target.value;
  try { localStorage.setItem("sort", sortBy); } catch {}
  render();
});
document.getElementById("board").addEventListener("click", e => {
  const step = e.target.closest("[data-cal]")?.dataset.cal;
  if (step === undefined) return;
  if (step === "0") { calMonth = new Date(); calMonth.setDate(1); }
  else calMonth.setMonth(calMonth.getMonth() + Number(step));
  render();
});
for (const v of ["status", "company", "calendar", "stats", "recent"]) {
  document.getElementById("v-" + v).addEventListener("click", () => {
    view = v;
    try { localStorage.setItem("view", v); } catch {}
    render();
  });
}
document.getElementById("run").addEventListener("click", async () => {
  await fetch("/api/run", { method: "POST" });
  setTimeout(refresh, 500);
});
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
